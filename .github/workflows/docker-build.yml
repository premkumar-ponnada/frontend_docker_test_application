name: Build and Push Frontend Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Frontend కి ఇది తప్పనిసరి - build time లోనే API URL కావాలి
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/task-frontend:${{ github.sha }}
